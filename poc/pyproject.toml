[project]
name = "wechat-agent-poc"
version = "0.1.0"
description = "Minimal personal-WeChat text AI Agent PoC with human approval"
requires-python = ">=3.11"
dependencies = [
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "cryptography>=43.0.0",
]
sqlcipher = [
    "sqlcipher3>=0.6.2",
]
live = [
    "cryptography>=43.0.0",
]
observe = [
    "starlette>=0.41,<0.50",
    "uvicorn>=0.32,<0.40",
]

[project.scripts]
wechat-agent-poc = "wechat_agent_poc.cli:main"
wechat-agent-api = "wechat_agent_poc.api_cli:main"
wechat-agent-pad = "wechat_agent_poc.pad_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
