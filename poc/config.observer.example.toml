# Independent GeWe read-only observer. Secrets stay in env refs.
# This file does not arm live WeChat, public HTTPS, or send.

config_version = "observer-config/1"
enabled = false
allow_live_send = false
allow_model = false
allow_network = false
authorization_ref = ""
bind_host = "127.0.0.1"
bind_port = 0
max_seconds = 1800
max_samples = 200
max_body_bytes = 10485760
rate_limit_per_second = 10
burst = 20

[ingress]
mode = "none"
callback_secret_ref = "env:WECHAT_CALLBACK_SECRET"
bridge_token_ref = "env:WECHAT_CALLBACK_BRIDGE_TOKEN"
path_prefix = "/callbacks/gewe"

[channel]
provider = "geweapi"
base_url_ref = "env:WECHAT_GATEWAY_BASE_URL"
credential_ref = "env:WECHAT_GATEWAY_TOKEN"
app_id_ref = "env:WECHAT_GATEWAY_APP_ID"

[binding]
account_key = ""
conversation_key = ""
binding_version = ""
candidate_member_keys = []

[store]
path = ".local/gewe-observe/observe.sqlite"

[probe]
online_interval_seconds = 15
profile_interval_seconds = 60
timeout_seconds = 8
